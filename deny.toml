[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# The list is the policy, not an inventory of what the graph holds today.
unused-allowed-license = "allow"

# Unmaintained crates are checked only among our crates' direct dependencies: the desktop app's
# native side pulls on Linux the GTK3 bindings, which are unmaintained but not vulnerable.
# Vulnerabilities are still checked across the whole graph.
[advisories]
unmaintained = "workspace"

# The direction of dependencies between the crates: each crate below may be used only by the ones
# listed, so the kernel never reaches a concrete engine and a client reaches only `protocol`.
[[bans.deny]]
crate = "claude"
wrappers = ["runtime"]

[[bans.deny]]
crate = "kernel"
wrappers = ["runtime"]

[[bans.deny]]
crate = "engine"
wrappers = ["kernel", "claude", "runtime"]

[[bans.deny]]
crate = "federation"
wrappers = ["kernel", "runtime"]
