# Each version comes from `.prototools`, except proto's own.
proto:
  # moon installs a proto of its own choosing when none is named here, and CI installs this one, so
  # both run the same.
  version: '0.62.2'
rust:
  # `moon setup` writes only the channel into `rust-toolchain.toml`. The components are declared
  # there because rustup installs them with the channel on any machine.
  syncToolchainConfig: true
  # cargo resolves dependencies on its own when it builds, and `cargo generate-lockfile` fails on a
  # workspace with no crates yet.
  installDependencies: false
javascript:
  packageManager: 'pnpm'
node: {}
pnpm: {}
