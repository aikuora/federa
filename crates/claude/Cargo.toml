[package]
name = "claude"
version = "0.0.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
engine = { path = "../engine" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "process", "rt", "sync"] }

[dev-dependencies]
# The version the runtime serves its MCP tools with, for a test server of its own.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["net"] }
