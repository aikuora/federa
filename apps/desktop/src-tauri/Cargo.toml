[package]
name = "desktop"
version = "0.0.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
dirs = "7.0.0"
futures-util = "0.3.34"
protocol = { path = "../../../crates/protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.6"
tauri-plugin-dialog = "2.8.4"
tokio = { version = "1.54.1", features = ["net", "sync", "time"] }
# The version the runtime's server already builds on, so the graph holds one WebSocket
# implementation.
tokio-tungstenite = "0.29.0"
toml = "1.2.1"

[build-dependencies]
tauri-build = "2.7.5"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
