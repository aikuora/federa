[package]
name = "runtime"
version = "0.0.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
claude = { path = "../../crates/claude" }
dirs = "7.0.0"
engine = { path = "../../crates/engine" }
getrandom = "0.4.3"
kernel = { path = "../../crates/kernel" }
protocol = { path = "../../crates/protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
toml = "1.2.1"

[dev-dependencies]
futures-util = "0.3.34"
tempfile = "3.27.0"
# The version axum's `ws` already builds on, so the graph holds one WebSocket implementation.
tokio-tungstenite = "0.29.0"
# The version axum already builds on, to drive the app in-process.
tower = { version = "0.5.3", features = ["util"] }
